name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "pyproject.toml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version into site
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          MINOR=$(echo "$VERSION" | sed 's/\.[^.]*$//')
          sed -i "s/v__MINOR__/v${MINOR}/g" site/index.html site/docs.html site/release-notes.html site/zh-cn/index.html site/zh-cn/docs.html site/zh-cn/release-notes.html

      - name: Copy CHANGELOG into site
        run: cp CHANGELOG.md site/CHANGELOG.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
