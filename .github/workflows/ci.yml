name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check license headers
        run: |
          missing=$(
            git ls-files '*.py' | while IFS= read -r file; do
              grep -q 'SPDX-License-Identifier' "$file" || echo "$file"
            done
          )
          if [ -n "$missing" ]; then echo "Missing SPDX header in:"; echo "$missing"; exit 1; fi

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: |
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            uv run pytest tests/ -m 'not live' -x -q \
              --cov=maxcompute_semantic \
              --cov-report=xml \
              --cov-report=term-missing:skip-covered \
              --cov-fail-under=85
          else
            uv run pytest tests/ -m 'not live' -x -q
          fi

      - name: Fetch PR base for diff coverage
        if: github.event_name == 'pull_request' && matrix.python-version == '3.10'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Check diff coverage
        if: github.event_name == 'pull_request' && matrix.python-version == '3.10'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run diff-cover coverage.xml --compare-branch "origin/$BASE_REF" --fail-under=80
