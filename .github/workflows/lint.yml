name: Lint (ruff + ty + mypy)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-diff:
    name: ruff + ty + mypy diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install ruff + ty
        run: |
          uv tool install ruff
          uv tool install ty

      - name: Install project deps (for mypy)
        run: uv sync --extra dev

      - name: Determine base ref
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF_NAME: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA=$(git merge-base "origin/$BASE_REF_NAME" HEAD)
            echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
            echo "ref=origin/${BASE_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ruff + ty + mypy on HEAD
        run: |
          mkdir -p .lint-reports/head
          ruff check src/ tests/ \
            --output-format json --exit-zero \
            > .lint-reports/head/ruff.json || true
          ty check src/ tests/ \
            --output-format gitlab --exit-zero \
            > .lint-reports/head/ty.json || true
          uv run mypy src/ --show-error-codes --no-pretty --no-error-summary \
            > .lint-reports/head/mypy.txt || true

      - name: Run ruff + ty + mypy on base (via git worktree)
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          mkdir -p .lint-reports/base
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$BASE_SHA" = "$HEAD_SHA" ]; then
            echo "Base SHA == HEAD SHA, skipping base scan."
            echo '[]' > .lint-reports/base/ruff.json
            echo '[]' > .lint-reports/base/ty.json
            : > .lint-reports/base/mypy.txt
          else
            git worktree add --detach /tmp/lint-base "$BASE_SHA"
            (
              cd /tmp/lint-base
              uv sync --extra dev
              ruff check src/ tests/ \
                --output-format json --exit-zero \
                > "$GITHUB_WORKSPACE/.lint-reports/base/ruff.json" || true
              ty check src/ tests/ \
                --output-format gitlab --exit-zero \
                > "$GITHUB_WORKSPACE/.lint-reports/base/ty.json" || true
              uv run mypy src/ --show-error-codes --no-pretty --no-error-summary \
                > "$GITHUB_WORKSPACE/.lint-reports/base/mypy.txt" || true
            )
            git worktree remove --force /tmp/lint-base
          fi

      - name: Generate diff summary
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
          HEAD_REF_PR: ${{ github.head_ref }}
          HEAD_REF_PUSH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            HEAD_REF="$HEAD_REF_PR"
          else
            HEAD_REF="$HEAD_REF_PUSH"
          fi
          python scripts/lint_diff.py \
            --base-ruff .lint-reports/base/ruff.json \
            --head-ruff .lint-reports/head/ruff.json \
            --base-ty   .lint-reports/base/ty.json \
            --head-ty   .lint-reports/head/ty.json \
            --base-mypy .lint-reports/base/mypy.txt \
            --head-mypy .lint-reports/head/mypy.txt \
            --base-dir  /tmp/lint-base \
            --base-ref  "$BASE_REF" \
            --head-ref  "$HEAD_REF" \
            --output    .lint-reports/summary.md
          cat .lint-reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post / update PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.lint-reports/summary.md', 'utf8');
            const marker = '<!-- lint-diff-summary -->';
            const fullBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: .lint-reports/
          if-no-files-found: ignore
          retention-days: 14

  ruff-blocking:
    name: ruff enforcement (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install ruff
        run: uv tool install ruff

      - name: ruff check
        run: ruff check src/ tests/

  mypy-blocking:
    name: mypy enforcement (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: mypy
        # Relocated from ci.yml's test matrix (ran 3x, once per Python).
        # mypy results are Python-version-independent; one run suffices.
        run: uv run mypy src/
